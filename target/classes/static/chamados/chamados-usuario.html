<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTI - Chamados</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body>

<div class="user-topbar">
    <div class="user-topbar-title">GTI - Chamados</div>
    <div class="user-topbar-nav">
        <button id="btn-abrir" class="active" onclick="mudarView('abrir')">Abrir chamado</button>
        <button id="btn-acompanhar" onclick="mudarView('acompanhar')">Acompanhar chamados</button>
    </div>
    <a href="#" class="user-topbar-logout" onclick="logout(); return false;">Logout →</a>
</div>

<div class="user-wrap">

    <!-- ── Abrir chamados.js ────────────────────────────────────────────────── -->
    <div class="user-view active" id="view-abrir">
        <div class="form-box">
            <h2>Abrir novo chamado</h2>
            <div class="form-sub">Descreva o problema. A equipe de TI será notificada.</div>

            <div class="field">
                <label>Título *</label>
                <input type="text" id="f-titulo" placeholder="ex: Computador não liga" maxlength="200" />
            </div>
            <div class="field">
                <label>Descrição *</label>
                <textarea id="f-descricao" rows="6" placeholder="Descreva o problema com o máximo de detalhes possível..."></textarea>
            </div>

            <button class="btn btn-primary btn-block" onclick="criarChamado()">
                Criar chamado
            </button>
        </div>
    </div>

    <!-- ── Acompanhar chamados ──────────────────────────────────────────── -->
    <div class="user-view" id="view-acompanhar">
        <h2 class="view-titulo">Meus chamados</h2>
        <div id="lista-chamados">
            <div class="empty">Carregando...</div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script src="../auth.js"></script>
<script>
    checarAuth();

    const API = '/api/chamados';
    let toastTimer = null;

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    function badgeStatus(s) {
        const map   = { ABERTO:'badge-bloq', EM_ANDAMENTO:'badge-date', CONCLUIDO:'badge-ativo' };
        const label = { ABERTO:'Aberto', EM_ANDAMENTO:'Em andamento', CONCLUIDO:'Concluído' };
        return `<span class="badge ${map[s]||''}">${label[s]||s}</span>`;
    }

    function formatData(d) {
        if (!d) return '-';
        const dt = new Date(d);
        return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }

    function mudarView(v) {
        document.querySelectorAll('.user-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.user-topbar-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + v).classList.add('active');
        document.getElementById('btn-' + v).classList.add('active');
        if (v === 'acompanhar') listarChamados();
    }

    async function criarChamado() {
        const titulo    = document.getElementById('f-titulo').value.trim();
        const descricao = document.getElementById('f-descricao').value.trim();

        if (!titulo)    { document.getElementById('f-titulo').focus(); toast('Informe o título.'); return; }
        if (!descricao) { document.getElementById('f-descricao').focus(); toast('Informe a descrição.'); return; }

        try {
            const res = await apiFetch(API, {
                method: 'POST',
                body: JSON.stringify({ titulo, descricao })
            });
            if (!res.ok) {
                const err = await res.json();
                toast('Erro: ' + (err.erro || 'Tente novamente.'));
                return;
            }
            document.getElementById('f-titulo').value = '';
            document.getElementById('f-descricao').value = '';
            toast('Chamado criado com sucesso.');
            mudarView('acompanhar');
        } catch (e) {
            toast('Erro ao conectar com o servidor.');
        }
    }

    async function listarChamados() {
        const wrap = document.getElementById('lista-chamados');
        if (!wrap) return;
        try {
            const res = await apiFetch(API);
            const chamados = await res.json();
            if (!chamados.length) {
                wrap.innerHTML = '<div class="empty">Você ainda não abriu nenhum chamado.</div>';
                return;
            }
            wrap.innerHTML = chamados.map(c => `
                <div class="chamado-row" onclick="window.location.href='detalhe-chamado-usuario.html?id=${c.id}'">
                    <div class="chamado-row-head">
                        <div class="chamado-row-titulo">#${c.id} - ${esc(c.titulo)}</div>
                        ${badgeStatus(c.status)}
                    </div>
                    <div class="chamado-row-desc">${esc(c.descricao)}</div>
                    <div class="chamado-row-meta">
                        <span>Aberto em ${formatData(c.dataAbertura)}</span>
                        ${c.tecnico ? `<span>Técnico: ${esc(c.tecnico.nomeCompleto || c.tecnico.nomeUsuario)}</span>` : '<span>Aguardando atendimento</span>'}
                    </div>
                </div>
            `).join('');
        } catch (e) {
            wrap.innerHTML = '<div class="empty" style="color:#dc2626">Erro ao carregar chamados.</div>';
        }
    }
    setInterval(listarChamados, 15000);
</script>
</body>
</html>
