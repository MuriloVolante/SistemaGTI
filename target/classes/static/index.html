<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTI — Gestão de Usuários</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f3f4f6;
          color: #111827;
          font-size: 14px;
        }

        .page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

        .page-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          margin-bottom: 1.5rem;
        }

        h1 { font-size: 20px; font-weight: 600; }
        .subtitle { font-size: 13px; color: #6b7280; margin-top: 2px; }

        .btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 8px 16px;
          border-radius: 8px;
          border: 1px solid #d1d5db;
          background: #fff;
          color: #111827;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          font-family: inherit;
          transition: background 0.12s;
        }
        .btn:hover { background: #f9fafb; }
        .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
        .btn-danger:hover { background: #fee2e2; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .card {
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        thead th {
          padding: 10px 16px;
          text-align: left;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: #6b7280;
          background: #f9fafb;
          border-bottom: 1px solid #e5e7eb;
        }
        tbody tr { border-bottom: 1px solid #e5e7eb; transition: background 0.1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }
        tbody td { padding: 12px 16px; vertical-align: middle; }

        .user-cell { display: flex; align-items: center; gap: 10px; }
        .avatar {
          width: 34px; height: 34px; border-radius: 50%;
          background: #eff6ff; color: #1e40af;
          font-size: 12px; font-weight: 600;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        .user-name { font-weight: 500; font-size: 13px; }
        .user-sub { font-size: 12px; color: #6b7280; }

        .badge {
          display: inline-flex; align-items: center;
          padding: 3px 8px; border-radius: 9999px;
          font-size: 11px; font-weight: 600;
        }
        .badge-ativo   { background: #f0fdf4; color: #166534; }
        .badge-bloq    { background: #fef2f2; color: #991b1b; }

        .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
        .empty { text-align: center; padding: 4rem 2rem; color: #9ca3af; font-size: 13px; }

        .overlay {
          display: none; position: fixed; inset: 0;
          background: rgba(0,0,0,0.4); z-index: 100;
          align-items: center; justify-content: center; padding: 1rem;
        }
        .overlay.open { display: flex; }

        .modal {
          background: #fff; border: 1px solid #e5e7eb;
          border-radius: 12px; padding: 1.5rem;
          width: 100%; max-width: 480px;
          max-height: 90vh; overflow-y: auto;
        }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
        .modal-footer {
          display: flex; justify-content: flex-end; gap: 8px;
          margin-top: 1.25rem; padding-top: 1rem;
          border-top: 1px solid #e5e7eb;
        }

        .field { margin-bottom: 1rem; }
        .field label {
          display: block; font-size: 12px; font-weight: 600;
          color: #6b7280; margin-bottom: 5px;
          text-transform: uppercase; letter-spacing: 0.04em;
        }
        .field input {
          width: 100%; padding: 9px 12px;
          border: 1px solid #d1d5db; border-radius: 8px;
          font-size: 13px; font-family: inherit;
          background: #fff; color: #111827;
          transition: border-color 0.12s;
        }
        .field textarea {
          width: 100%; padding: 9px 12px;
          border: 1px solid #d1d5db; border-radius: 8px;
          font-size: 13px; font-family: inherit;
          background: #fff; color: #111827;
          resize: vertical; min-height: 72px;
        }
        .field input:focus, .field textarea:focus {
          outline: none; border-color: #2563eb;
          box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }
        .field input.erro { border-color: #dc2626; }
        .erro-msg { font-size: 12px; color: #dc2626; margin-top: 4px; }

        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .divider { border: none; border-top: 1px solid #e5e7eb; margin: 1rem 0; }
        .section-label {
          font-size: 11px; font-weight: 600; text-transform: uppercase;
          letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 12px;
        }

        .confirm-box {
          background: #fff; border: 1px solid #e5e7eb;
          border-radius: 12px; padding: 1.5rem;
          max-width: 360px; width: 100%;
        }
        .confirm-box h4 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .confirm-box p  { font-size: 13px; color: #6b7280; line-height: 1.5; }
        .confirm-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.25rem; }

        .toast {
          position: fixed; bottom: 1.5rem; left: 50%;
          transform: translateX(-50%);
          background: #111827; color: #fff;
          border-radius: 8px; padding: 10px 18px;
          font-size: 13px; font-weight: 500;
          z-index: 200; opacity: 0;
          transition: opacity 0.2s; white-space: nowrap; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="page">
    <div class="page-header">
        <div>
            <h1>Gestão de usuários</h1>
        </div>
        <button class="btn btn-primary" onclick="abrirModalCriar()">+ Novo usuário</button>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th style="width:28%">Usuário</th>
                <th style="width:20%">Nome completo</th>
                <th style="width:22%">Descrição</th>
                <th style="width:12%">Status</th>
                <th style="width:18%; text-align:right">Ações</th>
            </tr>
            </thead>
            <tbody id="tbody">
            <tr><td colspan="5" class="empty">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Criar / Editar -->
<div class="overlay" id="modal-overlay" onclick="if(event.target===this)fecharModal('modal-overlay')">
    <div class="modal">
        <div class="modal-title" id="modal-title">Novo usuário</div>

        <div class="field">
            <label>Nome de usuário *</label>
            <input type="text" id="f-nome-usuario" placeholder="ex: murilo.silva" />
        </div>

        <div class="field">
            <label>Nome completo *</label>
            <input type="text" id="f-nome-completo" placeholder="Nome completo" />
        </div>

        <div class="field">
            <label>Descrição</label>
            <textarea id="f-desc" placeholder="Cargo, setor, observações..."></textarea>
        </div>

        <div class="field">
            <label>E-mail <span style="font-weight:400;text-transform:none">(opcional)</span></label>
            <input type="email" id="f-email" placeholder="email@exemplo.com" />
        </div>

        <hr class="divider" />
        <div class="section-label" id="senha-label">Senha</div>

        <div class="field-row">
            <div class="field">
                <label id="label-senha">Senha *</label>
                <input type="password" id="f-senha" placeholder="Digite a senha" />
            </div>
            <div class="field">
                <label>Confirmar senha *</label>
                <input type="password" id="f-senha2" placeholder="Repita a senha" />
                <div class="erro-msg" id="erro-senha" style="display:none">As senhas não coincidem.</div>
            </div>
        </div>

        <div id="extra-wrap" style="display:none">
            <hr class="divider" />
            <button class="btn btn-danger btn-sm" id="btn-bloquear" onclick="alterarBloqueio()">Bloquear conta</button>
        </div>

        <div class="modal-footer">
            <button class="btn" onclick="fecharModal('modal-overlay')">Cancelar</button>
            <button class="btn btn-primary" id="btn-salvar" onclick="salvar()">Criar</button>
        </div>
    </div>
</div>

<!-- Modal Confirmar Exclusão -->
<div class="overlay" id="confirm-overlay" onclick="if(event.target===this)fecharModal('confirm-overlay')">
    <div class="confirm-box">
        <h4>Excluir usuário</h4>
        <p id="confirm-msg"></p>
        <div class="confirm-footer">
            <button class="btn" onclick="fecharModal('confirm-overlay')">Cancelar</button>
            <button class="btn btn-danger" id="confirm-ok">Excluir</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API = 'http://localhost:8080/api/usuarios';
    let editandoId = null;
    let usuarioEditando = null;
    let toastTimer = null;

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function iniciais(nome) {
      return nome.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    function abrirModal(id)  { document.getElementById(id).classList.add('open'); }
    function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        fecharModal('modal-overlay');
        fecharModal('confirm-overlay');
      }
    });

    function renderTabela(usuarios) {
      const tbody = document.getElementById('tbody');
      if (!usuarios || usuarios.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Nenhum usuário cadastrado.</td></tr>`;
        return;
      }
      tbody.innerHTML = usuarios.map(u => `
        <tr>
          <td>
            <div class="user-cell">
              <div class="avatar">${esc(iniciais(u.nomeCompleto || u.nomeUsuario))}</div>
              <div>
                <div class="user-name">${esc(u.nomeUsuario)}</div>
                <div class="user-sub">${esc(u.email || '')}</div>
              </div>
            </div>
          </td>
          <td>${esc(u.nomeCompleto)}</td>
          <td><span class="user-sub">${esc(u.descricao) || '—'}</span></td>
          <td>
            <span class="badge ${u.bloqueado ? 'badge-bloq' : 'badge-ativo'}">
              ${u.bloqueado ? 'Bloqueado' : 'Ativo'}
            </span>
          </td>
          <td>
            <div class="actions-cell">
              <button class="btn btn-sm" onclick="abrirModalEditar(${u.id})">Editar</button>
              <button class="btn btn-sm btn-danger" onclick="confirmarExclusao(${u.id}, '${esc(u.nomeUsuario)}')">Excluir</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function listar() {
      try {
        const res = await fetch(API);
        renderTabela(await res.json());
      } catch (e) {
        document.getElementById('tbody').innerHTML =
          `<tr><td colspan="5" class="empty" style="color:#dc2626">
            Erro ao conectar. Verifique se o Spring Boot está rodando na porta 8080.
          </td></tr>`;
      }
    }

    function limparCampos() {
      ['f-nome-usuario','f-nome-completo','f-desc','f-email','f-senha','f-senha2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('erro-senha').style.display = 'none';
    }

    function abrirModalCriar() {
      editandoId = null;
      usuarioEditando = null;
      limparCampos();
      document.getElementById('modal-title').textContent = 'Novo usuário';
      document.getElementById('btn-salvar').textContent = 'Criar';
      document.getElementById('senha-label').textContent = 'Senha';
      document.getElementById('label-senha').textContent = 'Senha *';
      document.getElementById('extra-wrap').style.display = 'none';
      abrirModal('modal-overlay');
      setTimeout(() => document.getElementById('f-nome-usuario').focus(), 50);
    }

    async function abrirModalEditar(id) {
      try {
        const res = await fetch(`${API}/${id}`);
        const u = await res.json();
        usuarioEditando = u;
        editandoId = id;

        document.getElementById('modal-title').textContent = 'Editar usuário';
        document.getElementById('btn-salvar').textContent = 'Salvar';
        document.getElementById('senha-label').textContent = 'Redefinir senha';
        document.getElementById('label-senha').textContent = 'Nova senha';
        document.getElementById('f-nome-usuario').value = u.nomeUsuario || '';
        document.getElementById('f-nome-completo').value = u.nomeCompleto || '';
        document.getElementById('f-desc').value = u.descricao || '';
        document.getElementById('f-email').value = u.email || '';
        document.getElementById('f-senha').value = '';
        document.getElementById('f-senha2').value = '';
        document.getElementById('erro-senha').style.display = 'none';

        const btnBloquear = document.getElementById('btn-bloquear');
        btnBloquear.textContent = u.bloqueado ? 'Desbloquear conta' : 'Bloquear conta';
        btnBloquear.className = `btn btn-sm ${u.bloqueado ? '' : 'btn-danger'}`;
        document.getElementById('extra-wrap').style.display = 'block';

        abrirModal('modal-overlay');
        setTimeout(() => document.getElementById('f-nome-usuario').focus(), 50);
      } catch (e) {
        toast('Erro ao carregar usuário.');
      }
    }

    async function alterarBloqueio() {
      if (!editandoId || !usuarioEditando) return;
      const novoBloqueio = !usuarioEditando.bloqueado;
      try {
        const res = await fetch(`${API}/${editandoId}/bloqueio`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bloqueado: novoBloqueio })
        });
        usuarioEditando = await res.json();
        const btnBloquear = document.getElementById('btn-bloquear');
        btnBloquear.textContent = usuarioEditando.bloqueado ? 'Desbloquear conta' : 'Bloquear conta';
        btnBloquear.className = `btn btn-sm ${usuarioEditando.bloqueado ? '' : 'btn-danger'}`;
        listar();
        toast(novoBloqueio ? 'Conta bloqueada.' : 'Conta desbloqueada.');
      } catch (e) {
        toast('Erro ao alterar bloqueio.');
      }
    }

    async function salvar() {
      const nomeUsuario  = document.getElementById('f-nome-usuario').value.trim();
      const nomeCompleto = document.getElementById('f-nome-completo').value.trim();
      const descricao    = document.getElementById('f-desc').value.trim();
      const email        = document.getElementById('f-email').value.trim();
      const senha        = document.getElementById('f-senha').value;
      const senha2       = document.getElementById('f-senha2').value;

      if (!nomeUsuario)  { document.getElementById('f-nome-usuario').focus(); toast('Nome de usuário obrigatório.'); return; }
      if (!nomeCompleto) { document.getElementById('f-nome-completo').focus(); toast('Nome completo obrigatório.'); return; }

      // Na criação a senha é obrigatória; na edição só valida se preenchida
      if (!editandoId && !senha) { document.getElementById('f-senha').focus(); toast('Senha obrigatória.'); return; }

      if (senha || senha2) {
        if (senha !== senha2) {
          document.getElementById('erro-senha').style.display = 'block';
          document.getElementById('f-senha2').focus();
          return;
        }
      }
      document.getElementById('erro-senha').style.display = 'none';

      const body = { nomeUsuario, nomeCompleto, descricao, email };
      if (senha) body.senha = senha;

      try {
        let res;
        if (editandoId) {
          res = await fetch(`${API}/${editandoId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        } else {
          res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        if (!res.ok) {
          const err = await res.json();
          toast('Erro: ' + (err.erro || 'Tente novamente.'));
          return;
        }

        fecharModal('modal-overlay');
        listar();
        toast(editandoId ? 'Usuário atualizado.' : 'Usuário criado com sucesso.');
      } catch (e) {
        toast('Erro ao conectar com o servidor.');
      }
    }

    function confirmarExclusao(id, nome) {
      document.getElementById('confirm-msg').textContent =
        `Deseja excluir "${nome}"? Essa ação não pode ser desfeita.`;
      document.getElementById('confirm-ok').onclick = async () => {
        try {
          await fetch(`${API}/${id}`, { method: 'DELETE' });
          fecharModal('confirm-overlay');
          listar();
          toast('Usuário excluído.');
        } catch (e) {
          toast('Erro ao excluir usuário.');
        }
      };
      abrirModal('confirm-overlay');
    }

    listar();
</script>
</body>
</html>
