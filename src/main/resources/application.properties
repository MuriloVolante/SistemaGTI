spring.datasource.url=jdbc:mariadb://localhost:3306/sistemagti?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

server.port=8080

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Logs do sistema
logging.level.root=WARN
logging.level.com.gti=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

jwt.secret=gti-sistema-secret-key-2026-minimo32chars

# API key para endpoints de integração externa (/api/integracao/**)
integracao.api-key=APIKEY-SISTEMAGTI