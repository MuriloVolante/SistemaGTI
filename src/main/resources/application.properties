# Banco de Dados - MariaDB
# Altere username e password conforme o seu ambiente

spring.datasource.url=jdbc:mariadb://localhost:3306/sistemagti?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
# update  = cria e atualiza tabelas automaticamente
# create  = apaga e recria as tabelas a cada start
# validate = apenas valida, nao altera nada
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Servidor
server.port=8080