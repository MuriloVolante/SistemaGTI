<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTI - Detalhe do Chamado</title>
    <link rel="stylesheet" href="../style.css" />
</head>

<body class="has-sidebar">

<div class="sidebar-content">
    <div class="page page-full">

        <div class="det-header">
            <div style="display:flex;align-items:center;gap:1rem">
                <button class="btn btn-sm" onclick="window.location.href='chamados.html'">← Voltar</button>
                <div>
                    <div class="det-titulo" id="det-titulo">Carregando...</div>
                    <div class="det-sub" id="det-sub"></div>
                </div>
            </div>
            <div class="det-actions" id="det-actions"></div>
        </div>

        <div class="status-cards" id="status-cards">
            <div class="status-card"><div class="status-card-label">Carregando...</div></div>
        </div>

        <div class="main-grid">
            <div class="info-box">
                <div class="info-box-title">Informações do chamado</div>
                <div class="info-grid info-grid-2" id="info-grid">
                    <div class="info-cell"><div class="info-cell-label">Carregando</div><div class="info-cell-value">...</div></div>
                </div>
            </div>

            <div class="chat-box">
                <div class="chat-header">Conversa</div>
                <div class="chat-list" id="chat-list">
                    <div class="chat-empty">Carregando mensagens...</div>
                </div>
                <div id="chat-input-area">
                    <div class="chat-input-wrap">
                        <textarea id="chat-input" placeholder="Digite sua mensagem..." rows="2"></textarea>
                        <div class="chat-btn-row">
                            <button class="btn btn-primary" id="btn-enviar" onclick="enviarMensagem()" disabled>Enviar</button>
                            <span id="btn-concluir-wrap" title="É necessário escrever um parecer no chat antes de concluir.">
                                <button class="btn btn-danger" id="btn-concluir" onclick="concluirChamado()" disabled>Concluir</button>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ── Modal Edição ── -->
<div class="overlay" id="overlay-edicao" onclick="if(event.target===this)fecharModal('overlay-edicao')">
    <div class="modal modal-lg">
        <div class="modal-title">Editar chamado</div>

        <div class="field">
            <label>Título *</label>
            <input id="ed-titulo" maxlength="200" />
        </div>
        <div class="field">
            <label>Descrição *</label>
            <textarea id="ed-descricao" rows="4"></textarea>
        </div>

        <div class="field-row">
            <div class="field">
                <label>Categoria</label>
                <select id="ed-categoria">
                    <option value="">Sem categoria</option>
                    <option value="HARDWARE">Hardware</option>
                    <option value="SOFTWARE">Software</option>
                    <option value="REDE">Rede</option>
                    <option value="ACESSO">Acesso / Senha</option>
                    <option value="EMAIL">E-mail</option>
                    <option value="IMPRESSAO">Impressão</option>
                    <option value="TELEFONIA">Telefonia</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>
            <div class="field">
                <label>Prioridade</label>
                <select id="ed-prioridade">
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA">Média</option>
                    <option value="ALTA">Alta</option>
                    <option value="MUITO_ALTA">Muito alta</option>
                </select>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label>Ativo vinculado</label>
                <select id="ed-ativo">
                    <option value="">Sem ativo vinculado</option>
                </select>
            </div>
            <div class="field">
                <label>Técnico responsável</label>
                <select id="ed-tecnico">
                    <option value="">Sem técnico</option>
                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn" onclick="fecharModal('overlay-edicao')">Cancelar</button>
            <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
        </div>
    </div>
</div>

<!-- Confirmar exclusão -->
<div class="overlay" id="confirm-overlay" onclick="if(event.target===this)fecharModal('confirm-overlay')">
    <div class="confirm-box">
        <h4>Excluir chamado</h4>
        <p id="confirm-msg"></p>
        <div class="confirm-footer">
            <button class="btn" onclick="fecharModal('confirm-overlay')">Cancelar</button>
            <button class="btn btn-danger" id="confirm-ok">Excluir</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../navbar.js"></script>
<script src="../auth.js"></script>
<script src="../exclusao.js"></script>
<script>
    checarAuth();

    const params    = new URLSearchParams(location.search);
    const chamadoId = params.get('id');
    if (!chamadoId) { alert('ID do chamado não informado.'); window.location.href = 'chamados.html'; }

    const API         = '/api/chamados';
    const API_USERS   = '/api/usuarios';
    const API_ATIVOS  = '/api/ativos';

    let toastTimer    = null;
    let usuarioLogado = getUsuario();
    let chamadoCache  = null;
    let chatAreaEstado = null;

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function abrirModal(id)  { document.getElementById(id).classList.add('open'); }
    function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    function badgeStatus(s) {
        const map   = { ABERTO:'badge-bloq', EM_ANDAMENTO:'badge-date', CONCLUIDO:'badge-ativo' };
        const label = { ABERTO:'Aberto', EM_ANDAMENTO:'Em andamento', CONCLUIDO:'Concluído' };
        return `<span class="badge ${map[s]||''}">${label[s]||s}</span>`;
    }

    function badgePrioridade(p) {
        const map = {
            MUITO_ALTA: { cls:'badge-bloq',    label:'Muito alta' },
            ALTA:       { cls:'badge-date',    label:'Alta'       },
            MEDIA:      { cls:'badge-varchar', label:'Média'      },
            BAIXA:      { cls:'badge-ativo',   label:'Baixa'      },
        };
        const v = map[p] || { cls:'', label: p || '-' };
        return `<span class="badge ${v.cls}">${v.label}</span>`;
    }

    function formatData(d) {
        if (!d) return '-';
        const dt = new Date(d);
        return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }

    // ── Carregar chamado ─────────────────────────────────────────────────────
    async function carregarChamado() {
        try {
            const res = await apiFetch(`${API}/${chamadoId}`);
            if (!res.ok) {
                document.getElementById('det-titulo').textContent = 'Chamado não encontrado';
                return;
            }
            const c = await res.json();
            chamadoCache = c;

            document.getElementById('det-titulo').textContent = '#' + c.id + ' - ' + c.titulo;
            document.getElementById('det-sub').textContent =
                'Solicitante: ' + (c.solicitante?.nomeCompleto || c.solicitante?.nomeUsuario || '-');

            // Botões superiores - só permite ações se for o técnico atribuído
            const meuId = usuarioLogado?.id;
            const jaSouTecnico = c.tecnico && c.tecnico.id === meuId;
            const concluido    = c.status === 'CONCLUIDO';

            let acoesHtml = '';
            if (!c.tecnico && !concluido) {
                acoesHtml += `<button class="btn btn-sm btn-primary" onclick="assumirChamado()">Assumir chamado</button>`;
            }
            if (jaSouTecnico && !concluido) {
                acoesHtml += `<button class="btn btn-sm" onclick="abrirEdicao()">Editar</button>`;
                acoesHtml += `<button class="btn btn-sm btn-danger" onclick="confirmarExclusao()">Excluir</button>`;
            }
            if (concluido) {
                acoesHtml += `<button class="btn btn-sm btn-primary" onclick="reabrirChamado()">Reabrir chamado</button>`;
            }
            document.getElementById('det-actions').innerHTML = acoesHtml;

            // Cards
            document.getElementById('status-cards').innerHTML = `
                <div class="status-card">
                    <div class="status-card-label">Status</div>
                    <div class="status-card-value">${badgeStatus(c.status)}</div>
                </div>
                <div class="status-card">
                    <div class="status-card-label">Prioridade</div>
                    <div class="status-card-value">${badgePrioridade(c.prioridade)}</div>
                </div>
                <div class="status-card">
                    <div class="status-card-label">Solicitante</div>
                    <div class="status-card-value">${esc(c.solicitante?.nomeCompleto || c.solicitante?.nomeUsuario || '-')}</div>
                </div>
                <div class="status-card">
                    <div class="status-card-label">Técnico</div>
                    <div class="status-card-value">${c.tecnico ? esc(c.tecnico.nomeCompleto || c.tecnico.nomeUsuario) : '<span class="texto-cinza">Não atribuído</span>'}</div>
                </div>
            `;

            // Info grid
            document.getElementById('info-grid').innerHTML = `
                <div class="info-cell">
                    <div class="info-cell-label">Categoria</div>
                    <div class="info-cell-value">${esc(c.categoria || '-')}</div>
                </div>
                <div class="info-cell">
                    <div class="info-cell-label">Ativo vinculado</div>
                    <div class="info-cell-value">${c.ativo ? esc(c.ativo.patrimonio + ' - ' + c.ativo.marcaModelo) : '-'}</div>
                </div>
                <div class="info-cell">
                    <div class="info-cell-label">Aberto em</div>
                    <div class="info-cell-value">${formatData(c.dataAbertura)}</div>
                </div>
                <div class="info-cell">
                    <div class="info-cell-label">Concluído em</div>
                    <div class="info-cell-value">${c.dataFechamento ? formatData(c.dataFechamento) : '-'}</div>
                </div>
                <div class="info-cell info-cell-full">
                    <div class="info-cell-label">Descrição</div>
                    <div class="info-cell-value info-descricao">${esc(c.descricao)}</div>
                </div>
            `;

            // Bloqueia o chat se concluído OU se a TI ainda não assumiu
            // Só re-renderiza quando o estado muda
            const estadoChat = concluido ? 'concluido' : (!jaSouTecnico ? 'bloqueado' : 'input');
            if (estadoChat !== chatAreaEstado) {
                chatAreaEstado = estadoChat;
                if (estadoChat === 'concluido') {
                    document.getElementById('chat-input-area').innerHTML =
                        '<div class="chat-encerrado">Chamado concluído. A conversa não aceita mais mensagens.</div>';
                } else if (estadoChat === 'bloqueado') {
                    const msg = c.tecnico
                        ? 'Apenas o técnico que assumiu este chamado pode enviar mensagens.'
                        : 'Assuma o chamado para iniciar a conversa.';
                    document.getElementById('chat-input-area').innerHTML =
                        `<div class="chat-encerrado">${msg}</div>`;
                } else {
                    document.getElementById('chat-input-area').innerHTML = `
                        <div class="chat-input-wrap">
                            <textarea id="chat-input" placeholder="Digite sua mensagem..." rows="2"></textarea>
                            <div class="chat-btn-row">
                                <button class="btn btn-primary" id="btn-enviar" onclick="enviarMensagem()" disabled>Enviar</button>
                                <span id="btn-concluir-wrap" title="É necessário escrever um parecer no chat antes de concluir.">
                                    <button class="btn btn-danger" id="btn-concluir" onclick="concluirChamado()" disabled>Concluir</button>
                                </span>
                            </div>
                        </div>`;
                    atualizarBotoes();
                }
            }
        } catch (e) {
            document.getElementById('det-titulo').textContent = 'Erro ao carregar chamado';
        }
    }

    // ── Chat ─────────────────────────────────────────────────────────────────
    async function carregarMensagens() {
        try {
            const res = await apiFetch(`${API}/${chamadoId}/mensagens`);
            if (!res.ok) return;
            const msgs = await res.json();
            const wrap = document.getElementById('chat-list');

            if (!msgs.length) {
                wrap.innerHTML = '<div class="chat-empty">Sem mensagens ainda.</div>';
                return;
            }

            const meuId = usuarioLogado?.id;
            wrap.innerHTML = msgs.map(m => {
                if (m.tipo === 'ENCERRAMENTO' || m.tipo === 'REABERTURA') {
                    const nome = m.autor?.nomeCompleto || m.autor?.nomeUsuario || '-';
                    const cls  = m.tipo === 'ENCERRAMENTO' ? 'chat-sep-encerramento' : 'chat-sep-reabertura';
                    const rotulo = m.tipo === 'ENCERRAMENTO' ? 'Encerramento' : 'Reabertura';
                    return `
                        <div class="chat-sep ${cls}">
                            <div class="chat-sep-rotulo">${rotulo} · ${esc(nome)}</div>
                            <div class="chat-sep-msg">${esc(m.mensagem)}</div>
                            <div class="chat-sep-meta">${formatData(m.criadoEm)}</div>
                        </div>
                    `;
                }
                const minha = m.autor?.id === meuId;
                const nome  = m.autor?.nomeCompleto || m.autor?.nomeUsuario || '-';
                return `
                    <div class="chat-msg ${minha ? 'chat-msg-mine' : 'chat-msg-other'}">
                        ${!minha ? `<div style="font-size:11px;font-weight:600;margin-bottom:2px">${esc(nome)}</div>` : ''}
                        <div>${esc(m.mensagem)}</div>
                        <div class="chat-msg-meta">${formatData(m.criadoEm)}</div>
                    </div>
                `;
            }).join('');
            wrap.scrollTop = wrap.scrollHeight;
        } catch (e) {}
    }

    async function enviarMensagem() {
        const input = document.getElementById('chat-input');
        const texto = input.value.trim();
        if (!texto) return;
        try {
            const res = await apiFetch(`${API}/${chamadoId}/mensagens`, {
                method: 'POST',
                body: JSON.stringify({ mensagem: texto })
            });
            if (!res.ok) { const err = await res.json(); toast('Erro: ' + (err.erro || 'Tente novamente.')); return; }
            input.value = '';
            atualizarBotoes();
            carregarMensagens();
        } catch (e) { toast('Erro ao enviar mensagem.'); }
    }

    async function concluirChamado() {
        const input = document.getElementById('chat-input');
        const texto = input.value.trim();
        if (!texto) return;

        try {
            const resSt = await apiFetch(`${API}/${chamadoId}/status`, {
                method: 'PATCH',
                body: JSON.stringify({ status: 'CONCLUIDO', mensagem: texto })
            });
            if (!resSt.ok) { const err = await resSt.json(); toast('Erro ao concluir: ' + (err.erro || '')); return; }

            input.value = '';
            toast('Chamado concluído com sucesso.');
            await carregarChamado();
            await carregarMensagens();
        } catch (e) { toast('Erro ao concluir chamado.'); }
    }

    function atualizarBotoes() {
        const input = document.getElementById('chat-input');
        const btnE  = document.getElementById('btn-enviar');
        const btnC  = document.getElementById('btn-concluir');
        if (!btnE || !btnC) return;
        const temTexto = !!input.value.trim();
        btnE.disabled = !temTexto;
        btnC.disabled = !temTexto;
        const wrap = document.getElementById('btn-concluir-wrap');
        if (wrap) wrap.title = temTexto ? '' : 'É necessário escrever um parecer no chat antes de concluir.';
    }

    document.addEventListener('input', e => { if (e.target.id === 'chat-input') atualizarBotoes(); });
    document.addEventListener('keydown', e => {
        if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensagem();
        }
    });

    // ── Assumir ──────────────────────────────────────────────────────────────
    async function assumirChamado() {
        try {
            const res = await apiFetch(`${API}/${chamadoId}/assumir`, { method: 'PATCH' });
            if (!res.ok) { const err = await res.json(); toast('Erro: ' + (err.erro || '')); return; }
            toast('Chamado assumido.');
            carregarChamado();
        } catch (e) { toast('Erro ao assumir chamado.'); }
    }

    // ── Reabrir ──────────────────────────────────────────────────────────────
    async function reabrirChamado() {
        try {
            const res = await apiFetch(`${API}/${chamadoId}/reabrir`, { method: 'PATCH' });
            if (!res.ok) { const err = await res.json(); toast('Erro: ' + (err.erro || '')); return; }
            toast('Chamado reaberto.');
            chatAreaEstado = null;
            await carregarChamado();
            await carregarMensagens();
        } catch (e) { toast('Erro ao reabrir chamado.'); }
    }

    // ── Edição ───────────────────────────────────────────────────────────────
    async function abrirEdicao() {
        if (!chamadoCache) return;
        const c = chamadoCache;

        // Carregar selects
        await Promise.all([carregarTecnicosSelect(), carregarAtivosSelect()]);

        document.getElementById('ed-titulo').value      = c.titulo || '';
        document.getElementById('ed-descricao').value   = c.descricao || '';
        document.getElementById('ed-categoria').value   = c.categoria || '';
        document.getElementById('ed-prioridade').value  = c.prioridade || 'MEDIA';
        document.getElementById('ed-ativo').value       = c.ativo?.id || '';
        document.getElementById('ed-tecnico').value     = c.tecnico?.id || '';

        abrirModal('overlay-edicao');
    }

    async function carregarTecnicosSelect() {
        try {
            const res = await apiFetch(API_USERS);
            const users = await res.json();
            const tis = users.filter(u => u.tipoAcesso === 'TI');
            document.getElementById('ed-tecnico').innerHTML =
                '<option value="">Sem técnico</option>' +
                tis.map(u => `<option value="${u.id}">${esc(u.nomeCompleto || u.nomeUsuario)}</option>`).join('');
        } catch (e) {}
    }

    async function carregarAtivosSelect() {
        try {
            const res = await apiFetch(API_ATIVOS);
            const ativos = await res.json();
            const solId = chamadoCache?.solicitante?.id;
            let filtrados = ativos.filter(a =>
                a.responsavel && typeof a.responsavel === 'object' && a.responsavel.id === solId);

            // mantém o ativo já vinculado mesmo que não seja do solicitante (evita perder valor ao salvar)
            const atualId = chamadoCache?.ativo?.id;
            if (atualId && !filtrados.some(a => a.id === atualId)) {
                const atual = ativos.find(a => a.id === atualId);
                if (atual) filtrados = [atual, ...filtrados];
            }

            document.getElementById('ed-ativo').innerHTML =
                '<option value="">Sem ativo vinculado</option>' +
                filtrados.map(a => `<option value="${a.id}">${esc(a.patrimonio + ' — ' + a.marcaModelo)}</option>`).join('');
        } catch (e) {}
    }

    async function salvarEdicao() {
        const payload = {
            titulo:     document.getElementById('ed-titulo').value.trim(),
            descricao:  document.getElementById('ed-descricao').value.trim(),
            categoria:  document.getElementById('ed-categoria').value.trim(),
            prioridade: document.getElementById('ed-prioridade').value,
            ativoId:    document.getElementById('ed-ativo').value || null,
            tecnicoId:  document.getElementById('ed-tecnico').value || null,
        };

        if (!payload.titulo)    { toast('Título obrigatório.'); return; }
        if (!payload.descricao) { toast('Descrição obrigatória.'); return; }

        try {
            const res = await apiFetch(`${API}/${chamadoId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
            if (!res.ok) { const err = await res.json(); toast('Erro: ' + (err.erro || '')); return; }
            toast('Chamado atualizado.');
            fecharModal('overlay-edicao');
            carregarChamado();
        } catch (e) { toast('Erro ao salvar.'); }
    }

    // ── Excluir ──────────────────────────────────────────────────────────────
    function confirmarExclusao() {
        abrirModalExclusao({
            titulo: `Excluir chamado #${chamadoId}`,
            impactoUrl: `${API}/${chamadoId}/impacto-exclusao`,
            deleteUrl: `${API}/${chamadoId}`,
            palavraConfirmacao: `#${chamadoId}`,
            onSucesso: () => { setTimeout(() => window.location.href = 'chamados.html', 400); }
        });
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    carregarChamado();
    carregarMensagens();
    setInterval(carregarMensagens, 5000);
    setInterval(carregarChamado, 30000);
</script>
</body>
</html>
